# Konfiguracja nginx dla szybypleszew.pl.
# Instalacja: cp deploy/nginx-szybypleszew.conf /etc/nginx/sites-available/szybypleszew
#             ln -s /etc/nginx/sites-available/szybypleszew /etc/nginx/sites-enabled/ && nginx -t && systemctl reload nginx
# Certyfikat HTTPS dopisze certbot:  certbot --nginx -d szybypleszew.pl -d www.szybypleszew.pl
server {
    listen 80;
    listen [::]:80;
    server_name szybypleszew.pl www.szybypleszew.pl;

    # Zdjecia z telefonu przy wgrywaniu kilku naraz w panelu potrafia wazyc kilkadziesiat MB
    client_max_body_size 50M;

    # Kompresja tekstu (HTML, CSS, JS, SVG) – mniej danych do pobrania
    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json text/plain application/xml;

    # CSS/JS/logo: nginx podaje sam, bez Django. Nazwy plikow maja numer wersji, wiec moga byc trzymane rok.
    location /static/ {
        alias /home/szybypleszew/app/staticfiles/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Zapasowo, gdyby R2 bylo wylaczone (zdjecia wtedy leza lokalnie w media/)
    location /media/ {
        alias /home/szybypleszew/app/media/;
        expires 30d;
        access_log off;
    }

    location / {
        proxy_pass http://unix:/run/szybypleszew/gunicorn.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Django wie dzieki temu, ze odwiedzajacy jest na HTTPS (SECURE_PROXY_SSL_HEADER w settings.py)
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
